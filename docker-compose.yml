services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: skinai-postgres
    environment:
      POSTGRES_USER: skinai
      POSTGRES_PASSWORD: skinai_dev
      POSTGRES_DB: skinai_dev
    ports:
      - '5433:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U skinai -d skinai_dev']
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: skinai-redis
    ports:
      - '6380:6379'
    volumes:
      - redisdata:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
  redisdata:
