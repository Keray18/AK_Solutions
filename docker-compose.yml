services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: skinai-postgres
    environment:
      POSTGRES_USER: skinai
      POSTGRES_PASSWORD: skinai_dev
      POSTGRES_DB: skinai_dev
    ports:
      - '5433:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U skinai -d skinai_dev']
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: skinai-redis
    ports:
      - '6380:6379'
    volumes:
      - redisdata:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: skinai-backend
    restart: unless-stopped
    ports:
      - '4000:4000'
    environment:
      NODE_ENV: production
      PORT: 4000
      API_PREFIX: /api
      DATABASE_URL: postgres://skinai:skinai_dev@postgres:5432/skinai_dev
      JWT_SECRET: dev-secret-key-at-least-32-chars-long-for-testing
      JWT_ACCESS_EXPIRY: 15m
      JWT_REFRESH_EXPIRY: 7d
      FRONTEND_URL: http://localhost:3000
      EMAIL_VERIFICATION_REQUIRED: 'false'
      GOOGLE_AUTH_ENABLED: 'false'
      BETA_ACCESS_ENABLED: 'false'
      PRIMARY_AI_PROVIDER: openai
      SECONDARY_AI_PROVIDER: gemini
      TERTIARY_AI_PROVIDER: groq
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'wget', '--no-verbose', '--tries=1', '--spider', 'http://127.0.0.1:4000/health']
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  pgdata:
  redisdata:
